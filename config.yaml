# =============================================================================
# Model Configuration
# =============================================================================
model:
  default: "openai/gpt-4o"  # Ana model olarak GPT-4o kullanmasını istedik
  provider: "auto"          # Render'daki API key'den otomatik algılayacak

# =============================================================================
# Context Compression (Auto-shrinks long conversations)
# =============================================================================
compression:
  enabled: true
  threshold: 0.50
  target_ratio: 0.20
  protect_last_n: 20
  protect_first_n: 3

# =============================================================================
# Auxiliary Models (Özetleme ve Sıkıştırma Modeli)
# =============================================================================
# Hata veren kısmı burası tetikliyordu. OpenAI kullanması için "main" olarak ayarlıyoruz.
auxiliary:
  compression:
    provider: "main"
    model: "gpt-4o-mini" # Özetlemeyi hızlı ve ucuz olan gpt-4o-mini yapacak
