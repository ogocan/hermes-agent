model:
  provider: "openai"
  default: "gpt-4o"

custom_providers:
  - name: "openai"
    base_url: "https://api.openai.com/v1"
    key_env: "OPENAI_API_KEY"

auxiliary:
  compression:
    provider: "openai"
    model: "gpt-4o-mini"
  session_search:
    provider: "openai"
    model: "gpt-4o-mini"
  vision:
    provider: "openai"
    model: "gpt-4o-mini"

compression:
  enabled: true

telegram:
  require_mention: false
